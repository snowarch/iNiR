<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Grayscale antialiasing for the iNiR shell only: its surfaces are translucent, so subpixel
     text would fringe. prgname is the executable's real name, not argv[0]. Other applications
     keep the system's choice. -->
<fontconfig>
  <match target="font">
    <test target="pattern" name="prgname"><string>quickshell</string></test>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test target="pattern" name="prgname"><string>.quickshell-wrapped</string></test>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
