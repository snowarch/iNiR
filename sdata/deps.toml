          "qt6-qtmultimedia", "qt6-qtimageformats", "qt6-qttools"]
debian = ["qt6-base-dev", "qt6-declarative-dev", "qt6-svg-dev", "qt6-wayland-dev", "qt6-5compat-dev",
          "qt6-multimedia-dev", "qt6-image-formats-plugins"]
void = ["qt6-base", "qt6-declarative", "qt6-svg", "qt6-wayland", "qt6-qt5compat", "qt6-multimedia",
        "qt6-webengine", "layer-shell-qt", "qt6-imageformats", "qt6-virtualkeyboard"]

