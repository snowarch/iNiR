# What iNiR installs, per distro. The bash installers (sdata/dist-*/install-deps.sh)
# and the inir binary read the same table; a test keeps it equal to what those
# scripts install.
#
# Each [[dep]] is one thing the shell needs. `group` says when it goes in:
#   core           always
#   audio          unless --no-audio
#   toolkit        unless --no-toolkit
#   screencapture  unless --no-screencapture
#   fonts          unless --no-fonts
# `groups = [..]` installs it when any of them is on. A distro key gives its
# package, a list of them, or a table:
#   { pkg = "name", group = "fonts" }   another group (or groups) on this distro
#   { first = ["a", "b"] }              the first one the repositories have
#   { aur = "name" }                    Arch only: through the AUR helper
#   { build = "recipe" }                a provider in sdata/dist-*/providers.sh, run
#                                       after the packages when it is still missing
# `ubuntu` falls back to `debian`. No key: not installed on that distro.

schema = 1

# --- core: compositor, shell, Qt ------------------------------------------------

[[dep]]
name = "quickshell"
group = "core"
arch = "quickshell"
fedora = "quickshell"
debian = { pkg = "quickshell", build = "quickshell" }
void = "quickshell"

